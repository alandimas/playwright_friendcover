name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          npx playwright test \
            tests/great-shield-active/friendcover-prod-gsa-plan1.spec.js \
            tests/great-shield-active/friendcover-prod-gsa-plan2.spec.js \
            tests/great-shield-active/friendcover-prod-gsa-plan3.spec.js \
            tests/great-shield-active/friendcover-prod-gsa-plan4.spec.js \
            tests/great-shield-active/friendcover-prod-gsa-plan5.spec.js \
            tests/great-shield-active/friendcover-prod-gsa-plan6.spec.js \
            tests/great-shield-active/friendcover-prod-gsa-plan7.spec.js \
            tests/great-home-360/friendcover-prod-gh360-plan1.spec.js \
            tests/great-home-360/friendcover-prod-gh360-plan2.spec.js \
            tests/great-home-360/friendcover-prod-gh360-plan3.spec.js \
            tests/great-home-360/friendcover-prod-gh360-plan4.spec.js

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30